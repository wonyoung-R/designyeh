<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>designYEH 로컬 전후 비교</title><style>body{font:16px system-ui;background:#f4f1ea;color:#282820;margin:2rem}label{display:inline-block;margin:1rem}main{display:grid;grid-template-columns:1fr 1fr;gap:1rem}img{width:100%;height:auto;border:1px solid #ccc}a{color:inherit}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>designYEH 로컬 전후 비교</h1><p>2026-09-19 · Chrome · 높이 900 · reduced motion · 운영 미배포. 각 이미지를 누르면 전체 페이지를 확인합니다.</p><label>페이지 <select id="route"><option value="home">홈</option><option value="homepage-production">홈페이지 제작</option><option value="brand-identity">브랜드</option><option value="operations-automation">자동화</option><option value="contact">문의</option><option value="pricing">가격</option></select></label><label>화면 폭 <select id="width"><option>1440</option><option>768</option><option>390</option><option>360</option></select></label><main><section><h2>수정 전</h2><a id="beforeLink"><img id="before" alt="수정 전 화면"></a></section><section><h2>수정 후</h2><a id="afterLink"><img id="after" alt="수정 후 화면"></a></section></main><script>const r=document.getElementById('route'),w=document.getElementById('width');function update(){for(const p of ['before','after']){const stem=p+'/'+r.value+'-'+w.value;document.getElementById(p).src=stem+'-viewport.png';document.getElementById(p+'Link').href=stem+'.png'}}r.onchange=w.onchange=update;update();</script></html>
